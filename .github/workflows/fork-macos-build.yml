# Fork-only workflow: build the macOS arm64 release binary and run the full
# test suite on GitHub's runner, so the fork owner can install a tested binary
# without building on a disk-constrained Mac. Not intended for upstream.
name: fork-macos-build

on:
  push:
    branches: ['fix/frog-triage-20261116']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast feedback: the same lint, compile and test gates as upstream ci.yml,
  # on a Linux runner that starts sooner than the macOS one.
  linux-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-fork-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings

      # Lint failures must not hide test results, so the suite runs regardless.
      - name: Build release binary for tests
        if: ${{ !cancelled() }}
        run: cargo build --release --locked

      - name: Run the full test suite
        if: ${{ !cancelled() }}
        run: cargo nextest run --profile ci --no-fail-fast

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux-${{ github.sha }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  # The arm64 macOS pool did not pick up a single job on 2026-11-16 (every
  # job was cancelled after 15 minutes without a runner), so this job runs on
  # an Intel Mac: it cross-compiles the arm64 release binary, then runs the
  # suite natively, which covers the macOS-only tests.
  build-and-test:
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup target add aarch64-apple-darwin --toolchain "$channel"
          rustc --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-fork-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build arm64 release binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: dcg-aarch64-apple-darwin-${{ github.sha }}
          path: target/aarch64-apple-darwin/release/dcg
          retention-days: 14

      - name: Build native release binary for tests
        run: cargo build --release --locked

      - name: Run the full test suite
        run: cargo nextest run --profile ci --no-fail-fast

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-macos-${{ github.sha }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Run doc tests
        run: cargo test --doc
